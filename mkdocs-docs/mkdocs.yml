# mkdocs 工程(官方布局): 配置文件与内容目录同级
#   内容目录: mkdocs-docs/  (python / auto / linux / k8s-note / k8s-2023 / dba-note)
#   成品输出: site/        (在内容目录之外, mkdocs 禁止构建目录位于 docs_dir 内)
# 导航说明: nav 已固化在下方, 手工维护即可。新增页面时在对应栏目下加一行 "标题: 相对路径";
#           之前用于自动生成导航的 generate_nav.py 已按需要删除(它是根据 docsify 的 _sidebar.md 生成 nav 的一次性脚本)。
site_name: 程康华的实战笔记
site_url: https://docs.chengkanghua.top/
repo_url: https://github.com/chengkanghua/docs
repo_name: chengkanghua/docs
site_description: '程康华的 IT 实战笔记: Linux 运维 / K8s-DevOps 架构师 / Python 全栈 / 数据库'
docs_dir: mkdocs-docs
site_dir: site
use_directory_urls: false
# 排除第三方代码库/框架自带的文档噪音(非笔记内容, 与之前 generate_nav.py 的 EXCLUDE_DIR_NAMES 一致)
exclude_docs: |
  **/_*.md
  **/*.pyc
  **/__pycache__/
  **/uric_web/
  **/myblog/
  **/bootstrap/
  **/VueDemo/
  **/Muban/
  **/statics/
theme:
  name: material
  language: zh
  favicon: _media/wx.jpg
  font: false
  features:
  - navigation.tabs
  - navigation.tabs.sticky
  - navigation.top
  - search.suggest
  - search.highlight
  - content.code.copy
  palette:
  - media: '(prefers-color-scheme: light)'
    scheme: default
    primary: indigo
    accent: indigo
    toggle:
      icon: material/brightness-7
      name: 切换到暗色模式
  - media: '(prefers-color-scheme: dark)'
    scheme: slate
    primary: indigo
    accent: indigo
    toggle:
      icon: material/brightness-4
      name: 切换到亮色模式
markdown_extensions:
- admonition
- attr_list
- def_list
- footnotes
- md_in_html
- tables
- sane_lists
- toc:
    permalink: true
- pymdownx.highlight:
    anchor_linenums: true
- pymdownx.inlinehilite
- pymdownx.superfences
- pymdownx.caret
- pymdownx.mark
- pymdownx.tilde
- pymdownx.tasklist
- pymdownx.details
- pymdownx.tabbed
plugins:
- search:
    separator: '[\s\u200b\-、。，．？！；：（）、（）【】［］「」『』～〜ーぁ-んァ-ヴ一-龠]+'
    lang:
    - zh
extra:
  generator: false
copyright: Copyright &copy; 2022-2026 程康华 · <a href="https://beian.miit.gov.cn/" target="_blank" rel="noopener">赣ICP备2022002833号-1</a>
